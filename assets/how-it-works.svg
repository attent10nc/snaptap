<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>
  <rect width="960" height="330" rx="18" fill="#0d1117"/>
  <!-- time axis labels -->
  <g font-size="14" fill="#6e7891">
    <text x="190" y="304">press A</text>
    <text x="400" y="304">press D</text>
    <text x="610" y="304">release D</text>
    <text x="820" y="304">release A</text>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.08">
    <path d="M220 40V285M430 40V285M640 40V285M850 40V285"/>
  </g>

  <!-- without -->
  <text x="30" y="62" font-size="17" font-weight="700" fill="#ff6b6b">Without</text>
  <text x="30" y="84" font-size="13" fill="#6e7891">keys overlap</text>
  <g font-size="14" font-weight="700" fill="#cfd6e4">
    <text x="150" y="68">A</text><text x="150" y="106">D</text>
  </g>
  <rect x="220" y="52" width="630" height="22" rx="6" fill="#3a4157"/>
  <rect x="430" y="90" width="210" height="22" rx="6" fill="#3a4157"/>
  <rect x="430" y="48" width="210" height="68" rx="8" fill="#ff6b6b" fill-opacity="0.12" stroke="#ff6b6b" stroke-dasharray="5 4"/>
  <text x="535" y="138" text-anchor="middle" font-size="13" fill="#ff6b6b">A + D = you stop</text>

  <!-- with -->
  <text x="30" y="192" font-size="17" font-weight="700" fill="#00d4ff">snaptap</text>
  <text x="30" y="214" font-size="13" fill="#6e7891">last input wins</text>
  <g font-size="14" font-weight="700" fill="#cfd6e4">
    <text x="150" y="198">A</text><text x="150" y="236">D</text>
  </g>
  <rect x="220" y="182" width="210" height="22" rx="6" fill="url(#d)"/>
  <rect x="640" y="182" width="210" height="22" rx="6" fill="url(#d)"/>
  <rect x="430" y="220" width="210" height="22" rx="6" fill="url(#d)"/>
  <text x="535" y="268" text-anchor="middle" font-size="13" fill="#00d4ff">always exactly one direction</text>
</svg>
