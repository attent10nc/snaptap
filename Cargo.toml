[package]
name = "snaptap"
version = "1.0.0"
edition = "2021"
description = "Snap Tap / SOCD last-input-priority for A/D and W/S on Windows"
license = "MIT"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
