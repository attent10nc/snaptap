[package]
name = "snaptap"
version = "1.0.0"
authors = ["attent10nc"]
repository = "https://github.com/attent10nc/snaptap"
edition = "2021"
description = "Snap Tap / SOCD last-input-priority for A/D and W/S on Windows"
license = "MIT"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

[build-dependencies]
winresource = "0.1"
