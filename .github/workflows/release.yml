name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release
      - run: cargo build --release
      - name: SHA256
        shell: pwsh
        run: |
          Copy-Item target/release/snaptap.exe snaptap.exe
          $h = (Get-FileHash snaptap.exe -Algorithm SHA256).Hash.ToLower()
          "$h  snaptap.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            snaptap.exe
            SHA256SUMS.txt
